<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NewUI Package Installer</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 32px;
    background: #17181c;
    color: #eaeaee;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 20px;
    margin: 4px 0 2px;
  }
  .sub {
    color: #9a9ba3;
    font-size: 13px;
    margin-bottom: 20px;
    word-break: break-all;
  }
  .card {
    background: #1f2126;
    border-radius: 14px;
    padding: 6px;
    margin-bottom: 16px;
  }
  button.lang {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: transparent;
    border: none;
    color: #eaeaee;
    font-size: 16px;
    padding: 14px 12px;
    border-radius: 10px;
    text-align: left;
  }
  button.lang:active {
    background: #2a2d34;
  }
  button.lang.active {
    background: #2e3550;
  }
  .flag {
    font-size: 20px;
    margin-right: 12px;
  }
  .row {
    display: flex;
    align-items: center;
  }
  .check {
    color: #6d8bff;
    font-size: 18px;
    visibility: hidden;
  }
  button.lang.active .check {
    visibility: visible;
  }
  .status {
    font-size: 13px;
    color: #9a9ba3;
    min-height: 18px;
    margin-top: 4px;
  }
  .status.ok { color: #7ed99a; }
  .status.err { color: #ff8a8a; }
</style>
</head>
<body>

<h1>Язык интерфейса установщика</h1>
<div class="sub" id="pkgline">Определяю пакет…</div>

<div class="card" id="langList">
  <button class="lang" data-locale="ru-RU" data-key="ru"><span class="row"><span class="flag">🇷🇺</span>Русский</span><span class="check">✓</span></button>
  <button class="lang" data-locale="en-US" data-key="en"><span class="row"><span class="flag">🇬🇧</span>English</span><span class="check">✓</span></button>
  <button class="lang" data-locale="uk-UA" data-key="uk"><span class="row"><span class="flag">🇺🇦</span>Українська</span><span class="check">✓</span></button>
  <button class="lang" data-locale="kk-KZ" data-key="kk"><span class="row"><span class="flag">🇰🇿</span>Қазақша</span><span class="check">✓</span></button>
  <button class="lang" data-locale="" data-key="system"><span class="row"><span class="flag">⚙️</span>Системный язык</span><span class="check">✓</span></button>
</div>

<div class="status" id="status"></div>

<script>
const packages = [
  "com.miui.packageinstaller",
  "com.google.android.packageinstaller",
  "com.android.packageinstaller"
];

let targetPkg = null;

function extractStdout(res) {
  if (res == null) return "";
  if (typeof res === "string") return res;
  if (typeof res.stdout === "string") return res.stdout;
  return "";
}

async function run(cmd) {
  const res = await window.ksu.exec(cmd);
  return res;
}

async function detectPackage() {
  let debugParts = [];
  for (const pkg of packages) {
    let res, out = "";
    try {
      res = await run(`pm path ${pkg}`);
      out = extractStdout(res).trim();
    } catch (e) {
      out = "EXC:" + (e && e.message ? e.message : String(e));
    }
    debugParts.push(pkg + " => " + out.slice(0, 60));
    if (out.indexOf("package:") === 0 || out.indexOf(".apk") !== -1) {
      targetPkg = pkg;
      break;
    }
  }
  const line = document.getElementById("pkgline");
  if (targetPkg) {
    line.textContent = "Пакет: " + targetPkg;
  } else {
    line.textContent = "Не найден. DEBUG: " + debugParts.join(" | ").slice(0, 400);
  }
}

async function loadCurrent() {
  const res = await run("ksud module config get lang");
  const current = extractStdout(res).trim() || "system";
  document.querySelectorAll(".lang").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.key === current);
  });
}

function setStatus(text, cls) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status" + (cls ? " " + cls : "");
}

async function applyLang(btn) {
  if (!targetPkg) {
    setStatus("Нет целевого пакета, применить нельзя.", "err");
    return;
  }
  const locale = btn.dataset.locale;
  const key = btn.dataset.key;

  setStatus("Применяю…");
  const cmd = `cmd locale set-app-locales ${targetPkg} --user 0 --locales "${locale}"`;
  let res, threw = false;
  try {
    res = await run(cmd);
  } catch (e) {
    threw = true;
    res = e;
  }
  const outText = extractStdout(res).trim();

  if (!threw) {
    await run(`ksud module config set lang ${key}`);
    document.querySelectorAll(".lang").forEach(b => b.classList.toggle("active", b === btn));
    setStatus("Готово" + (outText ? (": " + outText) : "") + ". Перезапусти установщик пакета, если сразу не подхватилось.", "ok");
    if (window.ksu.toast) window.ksu.toast("Язык изменён");
  } else {
    setStatus("Ошибка: " + (outText || String(res)), "err");
  }
}

document.querySelectorAll(".lang").forEach(btn => {
  btn.addEventListener("click", () => applyLang(btn));
});

(async () => {
  if (typeof window.ksu === "undefined") {
    document.getElementById("pkgline").textContent = "window.ksu недоступен (страница открыта не через менеджер KernelSU?)";
    return;
  }
  await detectPackage();
  await loadCurrent();
})();
</script>

</body>
</html>
